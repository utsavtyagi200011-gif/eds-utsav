version: 1

indices:
  default:
    include:
      - /**
    exclude:
      - /drafts/**
      - /private/**
    target: /query-index.json
    properties:
      title:
        select: head > title
        value: textContent
      description:
        select: head > meta[name="description"]
        value: attribute(content)
      robots:
        select: head > meta[name="robots"]
        value: attribute(content)